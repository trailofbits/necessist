name: CI
description: Set up environment, build, and run tests

runs:
  using: composite
  steps:
    - name: Set up environment
      run: echo 'CARGO_TERM_COLOR=always' >> "$GITHUB_ENV"
      shell: bash

    - uses: actions/cache@v6
      with:
        path: |
          ~/.avm
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          ~/.dylint_drivers/
          ~/.rustup/toolchains/
          target/dylint/
          target/necessist-audit-cache/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - uses: taiki-e/install-action@v2.85.13
      with:
        tool: cargo-hack, cargo-udeps

    - name: Rustup
      run: rustup update
      shell: bash

    - name: Install CI tools
      if: ${{ contains(env.TESTS, 'ci') }}
      run: |
        rustup +nightly component add clippy rustfmt
        cargo install cargo-dylint --git=https://github.com/trailofbits/dylint --no-default-features --features=cargo-cli || true
        cargo install dylint-link              || true
        cargo install cargo-license            || true
        cargo install cargo-sort               || true
        cargo install cargo-supply-chain       || true
        cargo install cargo-unmaintained       || true
      shell: bash

    - name: Install testing tools
      if: ${{ env.TESTS != 'ci' }}
      uses: ./.github/actions/install-testing-tools

    - name: Install LLM tools
      if: ${{ (runner.os == 'Linux' || runner.os == 'macOS') && contains(env.TESTS, 'necessist_audit') }}
      run: |
        curl -fsSL https://claude.ai/install.sh | bash
        curl -fsSL https://chatgpt.com/codex/install.sh | sh
        printenv OPENAI_API_KEY | codex login --with-api-key
      shell: bash

    # smoelius: Codex requires Bubblewrap.
    - name: Install Bubblewrap on Ubuntu
      if: ${{ runner.os == 'Linux' && contains(env.TESTS, 'necessist_audit') }}
      run: |
        sudo apt install bubblewrap
        sudo apt install apparmor-profiles
        sudo cp /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d || true
        sudo systemctl reload apparmor
      shell: bash

    - name: Install sqlite3 on Ubuntu
      if: ${{ runner.os == 'Linux' }}
      run: |
        sudo apt update
        sudo apt install libsqlite3-dev
      shell: bash

    - name: Free up space on Ubuntu
      if: ${{ runner.os == 'Linux' }}
      run: |
        # https://github.com/actions/runner-images/issues/2606#issuecomment-772683150
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/share/swift
      shell: bash

    - name: Install PostgreSQL client libraries on macOS
      if: ${{ runner.os == 'macOS' }}
      run: |
        brew install libpq
        echo "LIBRARY_PATH=$(brew --prefix libpq)/lib:$LIBRARY_PATH" >> "$GITHUB_ENV"
      shell: bash

    - name: Disable incremental compilation on Windows
      if: ${{ runner.os == 'Windows' }}
      run: echo 'CARGO_INCREMENTAL=0' >> "$GITHUB_ENV"
      shell: bash

    - name: Enable debug logging
      if: ${{ runner.debug == 1 }}
      run: echo 'RUST_LOG=debug' >> "$GITHUB_ENV"
      shell: bash

    - name: Build
      run: |
        for TEST in $TESTS; do
          if [[ "$TEST" != 'other' ]]; then
            if [[ "$TEST" = 'necessist_audit' && '${{ github.event_name }}' != 'schedule' && '${{ github.event_name }}' != 'workflow_dispatch' ]] &&
              ! git diff --name-only ${{ github.event.pull_request.base.sha }} | grep 'necessist_audit' >/dev/null
            then
              exit 0
            fi
            $CARGO_TEST -p necessist --test "$TEST"
          else
            $CARGO_TEST -p necessist --test general
            $CARGO_TEST -p necessist-backends
            $CARGO_TEST -p necessist-core
          fi
        done
      shell: bash
      env:
        CARGO_TEST: cargo test --no-run

    - name: Test
      run: |
        for TEST in $TESTS; do
          if [[ "$TEST" != 'other' ]]; then
            cargo test -p necessist --test "$TEST" -- --nocapture
          else
            cargo test -p necessist --test general
            cargo test -p necessist-backends
            cargo test -p necessist-core
          fi
        done
      shell: bash
